<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#176b4a">
<title>Gudang (Finishing)</title>
<style>
  :root{
    --bg:#eaf1ed; --card:#fff; --ink:#003a3e; --muted:#6b7b74; --line:#d5dfda;
    --green:#1d8290; --green-soft:#e2f2e8; --red:#b3261e; --red-soft:#fbe9e7;
    --amber:#8a5a00; --amber-soft:#fff3d6;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    padding:20px 16px 40px; display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  .card{width:100%; max-width:600px; background:var(--card); border-radius:24px; padding:24px; box-shadow:0 8px 28px rgba(15,59,46,.08)}
  h1{margin:0; font-size:30px; letter-spacing:.2px}
  .sub{margin:2px 0 18px; color:var(--muted); font-size:15px}
  label,.lbl{display:block; font-weight:700; font-size:14px; margin:16px 0 8px}
  select,input[type=text]{
    width:100%; font-size:18px; padding:15px 18px; border:1px solid var(--line);
    border-radius:16px; background:#fff; color:#000; outline:none; font-family:inherit;
  }
  select:focus,input[type=text]:focus{border-color:var(--green); box-shadow:0 0 0 3px rgba(23,107,74,.18)}
  select:disabled{background:#f2f5f3; color:#555}

  .brands{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  .brand{
    font:inherit; font-weight:800; font-size:16px; padding:16px 6px; border-radius:16px;
    border:2px solid var(--line); background:#fff; color:var(--ink); cursor:pointer;
  }
  .brand[aria-pressed=true]{background:var(--green); border-color:var(--green); color:#fff}
  .brand:disabled{cursor:not-allowed; opacity:.55}
  button:focus-visible{outline:3px solid #7fc8a5; outline-offset:2px}

  .steps{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:6px}
  .step{border:2px solid var(--line); border-radius:14px; padding:10px; min-height:66px; background:#fff; overflow:hidden}
  .step b{display:block; font-size:12px; color:var(--muted); letter-spacing:.3px}
  .step span{display:block; margin-top:4px; font-size:14px; font-weight:700; word-break:break-all}
  .step.active{border-color:var(--green); box-shadow:0 0 0 3px rgba(23,107,74,.15)}
  .step.done{background:var(--green-soft); border-color:var(--green-soft)}

  .items{margin-top:10px; font-size:14px; color:var(--muted); font-family:ui-monospace,Menlo,Consolas,monospace}
  .items div{padding:3px 0; border-bottom:1px dashed var(--line); word-break:break-all}
  .items div:first-child{color:var(--ink); font-weight:700}

  .row{display:flex; gap:10px; margin-top:14px}
  .btn{
    flex:1; font:inherit; font-weight:800; font-size:18px; text-transform:uppercase;
    padding:16px; border:0; border-radius:16px; background:var(--green); color:#fff; cursor:pointer;
  }
  .btn:active{transform:scale(.99)}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn.dark{background:var(--ink)}
  .btn.alt{background:#fff; color:var(--green); border:2px solid var(--green); font-size:14px; padding:14px 12px}

  .status{margin-top:14px; padding:16px 18px; border-radius:16px; font-size:18px; background:var(--green-soft); min-height:56px; word-break:break-all}
  .status.err{background:var(--red-soft); color:var(--red)}
  .status.warn{background:var(--amber-soft); color:var(--amber)}
  .status.idle{background:#f2f5f3; color:var(--muted)}

  .tools{display:flex; justify-content:space-between; align-items:center; margin-top:14px; font-size:14px; color:var(--muted)}
  .link{background:none; border:0; padding:4px 0; font:inherit; color:var(--green); text-decoration:underline; cursor:pointer}

  .stat-label{color:var(--muted); font-size:15px}
  .total{font-size:44px; font-weight:800; line-height:1.1; margin:2px 0 10px}
  .total small{font-size:16px; font-weight:600; color:var(--muted)}
  hr{border:0; border-top:1px solid #999; margin:8px 0 14px}
  h2{margin:0 0 4px; font-size:19px}
  .last{color:var(--muted); font-size:15px; word-break:break-all}
  .perbrand{display:flex; gap:18px; margin:6px 0 4px; font-size:15px; flex-wrap:wrap}
  .perbrand b{font-size:20px}
  .queue{margin-top:10px; font-size:14px; color:var(--amber); font-weight:600}

  #cam{position:fixed; inset:0; background:#000; z-index:10; display:none; flex-direction:column}
  #cam.on{display:flex}
  #cam video{flex:1; width:100%; object-fit:cover}
  #cam button{margin:16px; padding:16px; font:inherit; font-weight:800; font-size:18px; border:0; border-radius:16px; background:#fff; color:var(--ink)}
</style>
</head>
<body>

<div class="card">
  <h1>FINISHING GUDANG</h1>
  <p class="sub">Terminal pencatatan barcode barang finishing</p>

  <label for="operator">USER</label>
  <select id="operator"></select>

  <div class="lbl" id="brandLabel">BRAND</div>
  <div class="brands" role="group" aria-labelledby="brandLabel" id="brands"></div>

  <div class="lbl">ALUR SCAN</div>
  <div class="steps" id="steps"></div>
  <div class="items" id="items"></div>

  <label for="barcode" id="scanLabel">SCAN BARCODE</label>
  <input id="barcode" type="text" placeholder="Scan barcode di sini" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">

  <div class="row">
    <button class="btn" id="save">Simpan scan</button>
    <button class="btn alt" id="camBtn" hidden>Kamera</button>
  </div>
  <div class="row">
    <button class="btn dark" id="finish" disabled>Kirim Data</button>
    <button class="btn" id="newrak" disabled>Pindah Rak</button>
  </div>
  <div class="row">
    <button class="btn alt" id="undo" disabled>Undo</button>
    <button class="btn alt" id="reset" disabled>Hapus Data</button>
  </div>

  <div class="status idle" id="status" role="status" aria-live="polite">Pilih brand, lalu scan barcode invoice.</div>

  <div class="tools">
    <button class="link" id="kbToggle">Aktifkan keyboard layar</button>
    <span id="net"></span>
  </div>
</div>

<div class="card">
  <div class="stat-label">Total di sesi ini</div>
  <div class="total"><span id="total">0</span> <small>invoice</small> &nbsp;<span id="totalItems">0</span> <small>barang</small></div>
  <div class="perbrand" id="perbrand"></div>
  <hr>
  <h2>Transaksi terakhir</h2>
  <div class="last" id="last">Belum ada scan.</div>
  <div class="queue" id="queue"></div>
</div>

<div id="cam">
  <video id="video" playsinline muted></video>
  <button id="camClose">Tutup kamera</button>
</div>

<script>
/* ============ PENGATURAN (edit di sini) ============ */
const CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxqrnjYF2m0yuDCSsr9ic5eVg1C4pXx5XysNVVEIvIxsl9pYdFLBBk_3l1jY_HOOMMAog/exec",
  OPERATORS: [
    "Agung Adhah",
    "Ahmad Fauzi",
    "Ahmad Kurniawan",
    "Ahmad Safi'i",
    "Ahmad Zakariya",
    "Ailmi Naimah",
    "Aldi Bayu Prasetyo",
    "Andita Dwi Lestari",
    "Anita",
    "Arya Febriana",
    "Davi Saputra",
    "Desi Apriliana",
    "Devi Nurfadilah",
    "Dewi Rahayu",
    "Dimas Saputra",
    "Dwi Ayu Ningtyas",
    "Eko Agung Tosa",
    "Fani Sulistiawati",
    "Gita Aprilia",
    "Heri Rinadi",
    "Kevin Erviani",
    "Khairunnisa",
    "Lucky Deksa Putra",
    "Meiva Azzahra",
    "Muhamad Rifqi",
    "Muhammad Rusly E",
    "Otong Kosasi",
    "Pratama Ahmad S",
    "Qomaruzzaman",
    "Rafli Ibrahimovic N",
    "Rhefi Shinta A",
    "Ridhah Khudaifah",
    "Salsa Aulia Putri",
    "Wendi Arya S",
    "Yudi Hariyadi"
],
  BRANDS: ["EXIT","EXPAND","EXITKIDS"],
  NEW_RAK_CODE: "RAKBARU",    // scan/ketik teks ini = sama dengan tombol "Rak baru" (ganti rak di invoice yang sama)
  RAK_PATTERN: "^(R|P|RC|YP|SP|YL|BS)[0-9A-Z_-]+",            // opsional: regex pengenal barcode rak, mis. "^RAK-" supaya rak baru terdeteksi otomatis tanpa tombol
  FINISH_CODE: "SELESAI",     // scan/ketik teks ini = sama dengan tombol Selesai (cetak sebagai barcode Code128 untuk operator)
  WARN_DUPLICATE_INVOICE: true // peringatan jika invoice yang sama dimulai lagi di sesi ini
};
/* ==================================================== */

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null? d : JSON.parse(v) }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} },
  del(k){ try{ localStorage.removeItem(k) }catch(e){} }
};

let brand = store.get("brand", "");
let queue = store.get("queue", []);
let session = { total:0, items:0, perBrand:{}, invoices:new Set() };
let sending = false;
const blankTx = () => ({ brand:"", operator:"", invoice:"", rak:"", items:[] });
let tx = store.get("draft", null) || blankTx();     // transaksi yang sedang berjalan (tersimpan, aman kalau halaman ter-reload)
tx.items.forEach(it => { if(!it.rak) it.rak = tx.rak; });
const phase = () => !tx.invoice ? 0 : !tx.rak ? 1 : 2;
const saveDraft = () => tx.invoice ? store.set("draft", tx) : store.del("draft");

/* ---------- UI awal ---------- */
const opSel = $("operator");
CONFIG.OPERATORS.forEach(o => opSel.add(new Option(o, o)));
opSel.value = store.get("operator", CONFIG.OPERATORS[0]);
opSel.addEventListener("change", () => { store.set("operator", opSel.value); focusInput(); });

const brandBox = $("brands");
CONFIG.BRANDS.forEach(b => {
  const el = document.createElement("button");
  el.type = "button"; el.className = "brand"; el.textContent = b; el.dataset.brand = b;
  el.addEventListener("click", () => { setBrand(b); focusInput(); });
  brandBox.appendChild(el);
  session.perBrand[b] = 0;
});
function setBrand(b){
  brand = b; store.set("brand", b);
  brandBox.querySelectorAll(".brand").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.brand===b)));
}
if(tx.invoice){ brand = tx.brand; opSel.value = tx.operator; }   // lanjutkan transaksi yang belum selesai
setBrand(CONFIG.BRANDS.includes(brand) ? brand : "");

/* ---------- Fokus & keyboard layar ---------- */
const input = $("barcode");
let screenKb = false;
input.setAttribute("inputmode", "none");
function focusInput(){ input.focus({preventScroll:true}); }
$("kbToggle").addEventListener("click", () => {
  screenKb = !screenKb;
  input.setAttribute("inputmode", screenKb ? "text" : "none");
  $("kbToggle").textContent = screenKb ? "Matikan keyboard layar" : "Aktifkan keyboard layar";
  input.blur(); focusInput();
});
document.addEventListener("click", e => {
  if(!e.target.closest("select,button,input,#cam")) focusInput();
});
window.addEventListener("load", focusInput);

/* ---------- Suara ---------- */
let ac;
function beep(ok){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = ok ? 1100 : 280; g.gain.value = .12;
    o.start(); o.stop(ac.currentTime + (ok ? .09 : .35));
  }catch(e){}
  if(!ok && navigator.vibrate) navigator.vibrate(200);
}
function say(msg, type){
  const s = $("status");
  s.textContent = msg;
  s.className = "status" + (type ? " "+type : "");
}
function fmt(d){
  const p = n => String(n).padStart(2,"0");
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

/* ---------- Tampilan alur ---------- */
function renderFlow(){
  const ph = phase(), n = tx.items.length;
  const last = n ? tx.items[n-1] : null;
  const raks = [];
  tx.items.forEach(i => {
    let g = raks.find(x => x.rak === i.rak);
    if(!g){ g = { rak:i.rak, n:0 }; raks.push(g); }
    g.n++;
  });
  const boxes = [
    ["1. INVOICE", tx.invoice || "-", ph > 0, ph === 0],
    ["2. RAK", (ph === 1 && n) ? "scan rak baru" : (tx.rak || "-"), ph > 1, ph === 1],
    ["3. BARANG", n ? n + " item" : "-", n > 0, ph === 2]
  ];
  $("steps").innerHTML = "";
  boxes.forEach(([t, v, done, active]) => {
    const d = document.createElement("div");
    d.className = "step" + (active ? " active" : done ? " done" : "");
    const b = document.createElement("b"); b.textContent = t;
    const s = document.createElement("span"); s.textContent = v;
    d.append(b, s); $("steps").appendChild(d);
  });

  const box = $("items"); box.innerHTML = "";
  if(raks.length){
    const sm = document.createElement("div");
    sm.textContent = "Rak: " + raks.map(g => `${g.rak} (${g.n})`).join(" · ");
    box.appendChild(sm);
  }
  tx.items.slice(-5).reverse().forEach((it, i) => {
    const d = document.createElement("div");
    d.textContent = `#${n - i}  ${it.rak} › ${it.barang}`;
    box.appendChild(d);
  });

  $("scanLabel").textContent = ph === 0 ? "SCAN BARCODE INVOICE"
    : ph === 1 ? (n ? "SCAN BARCODE RAK BARU" : "SCAN BARCODE RAK")
    : `SCAN BARCODE BARANG (#${n+1})`;
  input.placeholder = ph === 0 ? "Scan invoice di sini" : ph === 1 ? "Scan rak di sini" : "Scan barang di sini";

  const locked = !!tx.invoice;
  opSel.disabled = locked;
  brandBox.querySelectorAll(".brand").forEach(x => x.disabled = locked);
  $("finish").disabled = n === 0;
  $("newrak").disabled = !(ph === 2 && last && last.rak === tx.rak);
  $("undo").disabled = !locked;
  $("reset").disabled = !locked;
}

/* ---------- Proses tiap scan ---------- */
function handleScan(){
  const code = input.value.trim();
  if(!code){ beep(false); say("Barcode kosong.", "err"); focusInput(); return; }
  input.value = "";

  const up = code.toUpperCase();
  if(up === CONFIG.FINISH_CODE.toUpperCase()){ finish(); return; }
  if(up === CONFIG.NEW_RAK_CODE.toUpperCase()){ newRak(); return; }

  const ph = phase();
  if(ph === 0){
    if(!brand){ beep(false); say("Pilih brand dulu (EXIT / EXPAND / EXITKIDS).", "err"); return; }
    tx = blankTx(); tx.brand = brand; tx.operator = opSel.value; tx.invoice = code;
    const k = brand + "|" + code;
    const dup = CONFIG.WARN_DUPLICATE_INVOICE && session.invoices.has(k);
    saveDraft(); renderFlow(); focusInput();
    if(dup){ beep(false); say(`INVOICE SUDAH PERNAH DISCAN di sesi ini: ${code}. Lanjut scan RAK.`, "warn"); }
    else { beep(true); say(`INVOICE OK: ${code}. Lanjut scan RAK.`); }
    return;
  }
  if(ph === 1){
    // Cek apakah rak saat ini udah terisi minimal 1 barang
    // (Khusus kalau operator coba nembak rak lain padahal barang di rak sekarang belum discan)
    const hasItemsInCurrentRak = tx.items.some(i => i.rak === tx.rak);
    
    if (tx.rak && !hasItemsInCurrentRak) {
      beep(false); 
      say(`Rak ${tx.rak} masih kosong! Scan minimal 1 barang dulu sebelum pindah rak.`, "err"); 
      focusInput(); 
      return;
    }

    tx.rak = code; saveDraft(); renderFlow(); focusInput();
    beep(true);
    say(tx.items.length ? `RAK BARU OK: ${code}. Lanjut scan BARANG.`
                        : `RAK OK: ${code}. Scan BARANG sebanyak yang ada, lalu pilih KIRIM.`);
    return;
  }
  // ph === 2: barang, kecuali barcode ini cocok dengan pola rak (opsional)
  if(CONFIG.RAK_PATTERN && new RegExp(CONFIG.RAK_PATTERN, "i").test(code)){
    tx.rak = code; saveDraft(); renderFlow(); focusInput();
    beep(true); say(`RAK BARU: ${code}. Lanjut scan BARANG.`);
    return;
  }
  tx.items.push({ rak: tx.rak, barang: code, ts: fmt(new Date()) });
  saveDraft(); renderFlow(); focusInput();
  beep(true); say(`BARANG #${tx.items.length} (${tx.rak}): ${code}`);
}

function newRak(){
  const last = tx.items[tx.items.length-1];
  if(phase() < 2){ beep(false); say(phase() === 0 ? "Scan invoice dulu." : "Rak sedang menunggu discan.", "err"); focusInput(); return; }
  if(!last || last.rak !== tx.rak){ beep(false); say("Scan minimal 1 barang di rak ini dulu.", "err"); focusInput(); return; }
  const prev = tx.rak;
  tx.rak = ""; saveDraft(); renderFlow(); beep(true);
  say(`Ganti rak (sebelumnya ${prev}). Scan barcode RAK baru.`);
  focusInput();
}

function finish(){
  if(!tx.invoice || !tx.items.length){ beep(false); say("Belum ada barang yang discan.", "err"); focusInput(); return; }
  const payload = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    brand: tx.brand, operator: tx.operator, invoice: tx.invoice,
    rak: tx.rak || tx.items[tx.items.length-1].rak, items: tx.items
  };
  const n = payload.items.length;
  const rk = new Set(payload.items.map(i => i.rak)).size;
  queue.push(payload); store.set("queue", queue);
  session.total++; session.items += n; session.perBrand[payload.brand] += n;
  session.invoices.add(payload.brand + "|" + payload.invoice);
  tx = blankTx(); saveDraft();
  render(payload, n, rk); renderFlow(); focusInput();
  beep(true); say(`BERHASIL DISIMPAN: ${payload.invoice} | ${rk} rak | ${n} barang. Scan invoice berikutnya.`);
  flush();
}

$("finish").addEventListener("click", finish);
$("newrak").addEventListener("click", newRak);
$("save").addEventListener("click", handleScan);
input.addEventListener("keydown", e => { if(e.key==="Enter"){ e.preventDefault(); handleScan(); } });

$("undo").addEventListener("click", () => {
  const last = tx.items[tx.items.length-1];
  if(tx.rak){
    if(last && last.rak === tx.rak){ tx.items.pop(); say(`Barang terakhir dihapus: ${last.barang}`, "warn"); }
    else { say(`Rak dihapus: ${tx.rak}. Scan RAK lagi.`, "warn"); tx.rak = ""; }
  } else if(last){
    tx.rak = last.rak; say(`Kembali ke rak ${last.rak}.`, "warn");
  } else if(tx.invoice){
    say(`Invoice dihapus: ${tx.invoice}. Scan INVOICE lagi.`, "warn"); tx = blankTx();
  }
  beep(false); saveDraft(); renderFlow(); focusInput();
});
$("reset").addEventListener("click", () => {
  const n = tx.items.length;
  if(n && !confirm(`Batalkan transaksi ini? ${n} barang yang sudah discan akan dibuang.`)) { focusInput(); return; }
  tx = blankTx(); saveDraft(); renderFlow(); beep(false);
  say("Transaksi dibatalkan. Scan invoice baru.", "warn"); focusInput();
});
window.addEventListener("beforeunload", e => { if(phase() > 0 && tx.items.length){ e.preventDefault(); e.returnValue = ""; } });

/* ---------- Kirim ke Google Sheets ---------- */
async function flush(){
  if(sending || !queue.length) return;
  if(CONFIG.SCRIPT_URL.startsWith("PASTE_")){ say("SCRIPT_URL belum diisi di index.html.", "err"); updateQueue(); return; }
  sending = true;
  while(queue.length){
    try{
      const res = await fetch(CONFIG.SCRIPT_URL, { 
        method: "POST", 
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(queue[0]) 
      });
      const data = await res.json();
      if(!data.ok) throw new Error(data.error || "ditolak server");
      queue.shift(); store.set("queue", queue); updateQueue();
    }catch(err){ break; }
  }
  sending = false;
  updateQueue();
}
setInterval(flush, 8000);
window.addEventListener("online", flush);

function updateQueue(){
  $("queue").textContent = queue.length ? `${queue.length} transaksi menunggu terkirim ke spreadsheet (dicoba ulang otomatis)` : "";
  $("net").textContent = navigator.onLine ? "Online" : "Offline";
}
window.addEventListener("offline", updateQueue);

function render(p, n, rk){
  $("total").textContent = session.total;
  $("totalItems").textContent = session.items;
  $("perbrand").innerHTML = "";
  CONFIG.BRANDS.forEach(b => {
    const d = document.createElement("div");
    d.append(b + " ");
    const x = document.createElement("b"); x.textContent = session.perBrand[b];
    d.appendChild(x); $("perbrand").appendChild(d);
  });
  $("last").textContent = `${p.invoice} | ${rk} rak | ${n} barang | ${p.brand} | ${p.operator}`;
  updateQueue();
}

/* ---------- Kamera (opsional, Chrome Android / HTTPS) ---------- */
if("BarcodeDetector" in window && navigator.mediaDevices?.getUserMedia){
  $("camBtn").hidden = false;
  let stream, timer, det, last = "", lastAt = 0;
  const stop = () => { clearInterval(timer); stream && stream.getTracks().forEach(t=>t.stop()); $("cam").classList.remove("on"); focusInput(); };
  $("camBtn").addEventListener("click", async () => {
    try{
      det = det || new BarcodeDetector();
      stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" } });
      const v = $("video"); v.srcObject = stream; await v.play();
      $("cam").classList.add("on");
      timer = setInterval(async () => {
        try{
          const r = await det.detect(v);
          if(r.length){ input.value = r[0].rawValue; stop(); handleScan(); }
        }catch(e){}
      }, 250);
    }catch(e){ say("Kamera tidak bisa dibuka (izin ditolak atau bukan HTTPS).", "err"); }
  });
  $("camClose").addEventListener("click", stop);
}

renderFlow();
if(tx.invoice) say(`Transaksi sebelumnya belum selesai dilanjutkan: ${tx.invoice} (${tx.items.length} barang).`, "warn");
updateQueue();
if(queue.length) flush();
</script>
</body>
</html>
